function recordCard(r){return `<article class="recordcard" data-search="${esc(r.target+' '+r.text)}"><div class="row"><div class="row" style="justify-content:flex-start">${r.target.startsWith('Turma')?`<span class="circle-icon" style="background:var(--blue)">${I('Users')}</span>`:avatar(r.target)}<div><strong style="font-size:12px">${esc(r.target)}</strong><div class="record-meta">${I(r.kind==='Voz'?'Mic':r.kind==='Foto'?'Image':'Pencil')}${r.kind} · ${r.date.split('-').reverse().slice(0,2).join('/')} · ${r.time||'Agora'}</div></div></div>${pill('Registrado','green','Check')}</div><p>${esc(r.text)}</p>${r.photo?`<img class="photo-preview" src="${r.photo}" alt="Foto do registro demonstrativo">`:''}${r.plan?`<a class="linkchip" href="#/application/${S.applications.find(a=>a.plan===r.plan)?.id||'a1'}">${I('Link')} ${esc(S.plans.find(p=>p.id===r.plan)?.title||'Planejamento')}</a>`:''}</article>`}
function planCard(p,lib=false){return `<a class="card hover" data-search="${esc(p.title+' '+p.theme)}" href="#/${lib?'library':'plan'}/${p.id}"><div class="card-top ${p.color||'lav'}"><div>${pill(p.age||'4–5 anos','quiet')}<h3 style="font-size:24px;margin-top:15px;max-width:220px">${esc(p.title)}</h3></div><div class="bigicon">${I(p.color==='green'?'Leaf':p.color==='blue'?'Pencil':'BookOpen')}</div></div><div class="card-body"><p>${esc(p.desc)}</p><div class="chips">${pill(p.duration||'45 minutos','quiet','Clock')}${!lib?pill(p.status==='Rascunho'?'Rascunho':'Pronto para usar',p.status==='Rascunho'?'yellow':'green'):''}</div><div class="card-foot"><span>${esc(p.source||'Criado por você')}</span>${I('ArrowRight')}</div></div></a>`}
function plans(lib){return head('PREPARAR O CAMINHO','Planejamento',lib?'Boas ideias crescem quando são compartilhadas.':'Suas ideias, organizadas para ganhar vida em sala.',link('Criar plano','edit/new','btn primary','Plus'))+tabs([['Meus planos','plans',!lib],['Biblioteca','plans/library',lib]])+(compact?notice('planos'):'')+`<div class="toolbar"><div class="searchfield">${I('Search')}<input placeholder="${lib?'Encontre uma ideia para sua turma':'Buscar nos seus planos'}" aria-label="Buscar planos" data-filter="plans"></div><select class="filter" aria-label="Filtrar por tema" data-theme><option value="">Todos os temas</option>Cultura e identidade</option>Natureza e exploração</option>Escuta e imaginação</option>Arte e expressão</option></select><span class="fine">${(lib?library:S.plans).length} planos</span></div><div class="grid ${lib?'cols3':'cols2'}" id="planlist">${(lib?library:S.plans).map(p=>planCard(p,lib)).join('')}</div><div id="filterempty" class="empty" hidden><h3>Nenhum plano por aqui.</h3><p>Tente outro termo ou tema.</p></div>`}
function planPage(id,lib=false){const p=(lib?library:S.plans).find(p=>p.id===id);if(!p)return notFound();return back(lib?'Biblioteca':'Meus planos',lib?'plans/library':'plans')+head(lib?'IDEIA COMPARTILHADA':'SEU PLANEJAMENTO',esc(p.title),esc(p.desc),lib?btn('Usar este plano','copy:'+id,'primary','Copy'):link('Editar plano','edit/'+id,'btn primary','Pencil'))+(compact?notice('planos'):'')+`<div class="editor-grid"><div class="paper"><div class="chips">${pill(p.age,'lav')}${pill(p.duration,'quiet','Clock')}${pill(p.theme,'quiet')}</div><h3>Intenção pedagógica</h3><p>${esc(p.objectives)}</p><h3>O que vamos preparar</h3><p>${esc(p.materials)}</p><h3>Como a experiência acontece</h3><p style="white-space:pre-line">${esc(p.steps)}</p><h3>Um olhar durante a atividade</h3><p>Observar como cada criança participa, se expressa e interage. Registrar as descobertas reais, respeitando diferentes formas de participação.</p></div><aside class="stack sticky-panel"><div class="card pad"><span class="eyebrow">${lib?'DA BIBLIOTECA PARA SUA TURMA':'DO PLANO PARA A SALA'}</span><h3 style="margin:12px 0">${lib?'Uma ideia para fazer sua.':'Quando vamos viver isso?'}</h3><p class="muted" style="font-size:12px;margin-bottom:20px">${lib?'Crie uma cópia e adapte livremente. O original permanece preservado.':'Escolha a turma e a data. Este mesmo plano pode ganhar vida em outros momentos.'}</p>${compact&&lib?`<p class="fine">Use o computador para copiar e adaptar.</p>`:lib?btn('Copiar e adaptar','copy:'+id,'primary','Copy'):btn('Agendar na turma','schedule:'+id,'primary','CalendarDays')}</div>${!lib?`<div class="card pad soft"><h3>Aplicações deste plano</h3>${S.applications.filter(a=>a.plan===id).map(a=>`<a class="listitem" href="#/application/${a.id}"><div class="grow"><strong>Turma ${a.class}</strong><p>${a.date.split('-').reverse().join('/')} · ${a.status}</p></div>${I('ChevronRight')}</a>`).join('')||'<p class="fine" style="margin-top:12px">Ainda não foi agendado.</p>'}</div>${!compact?btn('Compartilhar na biblioteca','publish:'+id,'','Share2'):''}`:`<div class="fine">${esc(p.source)} · conteúdo demonstrativo<br>Uma cópia mantém a referência de autoria.</div>`}</aside></div>`}
function restricted(kind,returnPath){return back(kind==='planos'?'Planejamento':'Voltar',returnPath)+head('CONSULTAR NO CELULAR','Um pouco mais de espaço.',`A construção de ${kind} fica mais confortável no computador.`)+notice(kind)+`<div class="card pad"><h3>O seu trabalho continua aqui.</h3><p class="muted" style="margin:12px 0 22px">Consulte os conteúdos e registre as descobertas durante o dia. Depois, retome a edição pelo computador.</p>${link('Continuar navegando',returnPath,'btn primary')}</div>`}
function editor(id){if(compact)return restricted('planos','plans');if(!planDraft||planDraft.editId!==id){const p=S.plans.find(p=>p.id===id);planDraft=p?{...p,editId:id}:{id:'p'+Date.now(),editId:id,title:'',desc:'',objectives:'',materials:'',steps:'',age:'4–5 anos',duration:'45 minutos',theme:'Cultura e identidade',color:'lav',status:'Rascunho',source:'Criado por você'};suggestion=false}const d=planDraft;return back('Meus planos','plans')+head('ESPAÇO DE CRIAÇÃO',id==='new'?'Vamos preparar uma descoberta?':'Seu plano, do seu jeito.','Escreva livremente ou convide a IA para ajudar. Você decide o que fica.',btn('Salvar plano','save-plan','primary','Check'))+`<div class="editor-grid"><div class="card pad"><div class="mode-tabs"><button class="${planMethod==='manual'?'active':''}" data-act="plan-method:manual">${I('Pencil')}Escrever ou colar</button><button class="${planMethod==='ai'?'active':''}" data-act="plan-method:ai">${I('Sparkles')}Criar com IA</button></div>${field('Título do plano','title',d.title,'Ex.: Folclore do Sul do Brasil','plan')}${field('Conte um pouco sobre a proposta','desc',d.desc,'O que você gostaria de explorar com a turma?','plan',true)}<div class="formgrid">${field('Faixa etária','age',d.age,'','plan')}${field('Duração prevista','duration',d.duration,'','plan')}</div><div class="field"><label>Modelo de planejamento</label><select><option>Modelo Guiadoo · objetivos, materiais e etapas</option><option>Meu modelo personalizado · exemplo</option></select></div>${planMethod==='ai'?`<div class="attention">${I('Sparkles')}<p>No protótipo, a sugestão é um exemplo predefinido. Nenhum conteúdo é enviado a uma IA.</p></div>${btn('Ver sugestão de exemplo','plan-suggest','ai','Sparkles')}`:''}<hr class="divider">${field('Objetivos / intenção pedagógica','objectives',d.objectives,'O que esta experiência pretende favorecer?','plan',true)}${field('Materiais','materials',d.materials,'O que será necessário?','plan',true)}${field('Desenvolvimento','steps',d.steps,'Descreva os momentos da atividade.','plan',true)}<div class="formfooter"><span class="fine">Alterações locais neste protótipo.</span>${btn('Salvar plano','save-plan','primary','Check')}</div></div><aside class="sticky-panel"><div class="ai-panel">${pill('ASSISTÊNCIA OPCIONAL','coral','Sparkles')}<h3>Uma ideia pode abrir outra.</h3><p>Peça uma adaptação, confira a proposta e escolha o que faz sentido para sua turma.</p><div class="field"><label for="ai-request">Como posso ajudar?</label><textarea id="ai-request" placeholder="Adapte para 30 minutos e use materiais que já temos na sala."></textarea></div>${btn('Ver adaptação de exemplo','plan-suggest','ai','Sparkles')}${suggestion?`<div class="suggestion"><strong>Proposta de adaptação</strong><p style="margin-top:9px">Uma roda de histórias de 30 minutos, seguida de desenho livre, usando livros, papel e lápis da sala.</p><div class="actions">${btn('Aceitar','accept-plan','primary small','Check')}${btn('Descartar','discard-plan','small')}</div></div>`:''}</div><div class="sheetinfo">${I('LockKeyhole')}<p style="margin-top:8px">Seu plano começa privado. Você escolhe se quer compartilhá-lo depois.</p></div></aside></div>`}
function field(label,key,value,ph='',scope='record',area=false,type='text'){return `<div class="field"><label for="${scope}-${key}">${label}</label>${area?`<textarea id="${scope}-${key}" data-scope="${scope}" data-key="${key}" placeholder="${ph}">${esc(value)}</textarea>`:`<input id="${scope}-${key}" data-scope="${scope}" data-key="${key}" type="${type}" value="${esc(value)}" placeholder="${ph}">`}</div>`}
function application(id){const a=S.applications.find(x=>x.id===id)||S.applications[0],p=S.plans.find(x=>x.id===a.plan);return back('Planejamentos da turma','class/plans')+head('TURMA GIRASSOL · ATIVIDADE PLANEJADA',esc(p.title),`${a.date.split('-').reverse().join('/')} · ${p.duration}`,link('Registrar atividade','capture/'+p.id,'btn primary','Mic'))+`<div class="chips" style="margin-bottom:25px">${pill(a.status,'lav')}${pill('Versão aplicada preservada','quiet','LockKeyhole')}</div><div class="split"><div class="paper"><h3 style="margin-top:0">A proposta de hoje</h3><p>${esc(p.desc)}</p><h3>Como vamos viver essa experiência</h3><p style="white-space:pre-line">${esc(p.steps)}</p><div class="formfooter">${link('Ver plano completo','plan/'+p.id,'textlink')}${btn(a.status==='Concluído'?'Avaliar aplicação':'Marcar como concluído','complete-app:'+a.id,'small','Check')}${a.status!=='Concluído'?btn('Reagendar','rev-reschedule:'+a.id,'small','CalendarDays'):''}</div></div><aside><div class="card pad" style="background:var(--blue)"><h3>Aconteceu?<br>Guarde esse momento.</h3><p style="font-size:12px;margin:13px 0 20px">O registro já ficará ligado a esta atividade e à turma.</p>${link('Fazer um registro','capture/'+p.id,'btn primary','Mic')}</div><div class="section-title"><h2>O que aconteceu</h2></div><div class="stack">${S.records.filter(r=>r.plan===p.id).slice(0,2).map(recordCard).join('')}</div></aside></div>`}
function capture(planId){if(planId&&recordDraft.plan!==planId)recordDraft.plan=planId;return head('GUARDAR UMA DESCOBERTA','O que aconteceu hoje?','Uma frase já pode guardar uma história importante.')+`<div class="wizard"><div class="card pad"><div class="row" style="margin-bottom:22px">${pill('Turma Girassol','blue','Users')}<span class="fine">${recordDraft.date.split('-').reverse().join('/')}</span></div><div class="mode-tabs">${['Texto','Voz','Foto'].map(m=>`<button data-act="capture-mode:${m}" class="${captureMode===m?'active':''}">${I(m==='Texto'?'Pencil':m==='Voz'?'Mic':'Image')}${m}</button>`).join('')}</div>${captureMode==='Voz'?`<div class="voice"><h3>${recording?'Uma descoberta por vez…':recorded?'Pronto para revisar.':'Fale como você contaria a alguém.'}</h3><button class="record-button" data-act="voice" aria-label="${recording?'Encerrar exemplo de gravação':'Ouvir exemplo de transcrição'}">${I(recording?'Square':'Mic')}</button><div class="wave ${recording?'play':''}">${Array.from({length:23},(_,i)=>`<i style="--h:${10+((i*17)%28)}px;--d:${(i%5)*.1}s"></i>`).join('')}</div><p class="fine" style="margin-top:13px">${recording?'Toque para concluir a demonstração.':'Demonstração de voz · o microfone não é acessado.'}</p></div>`:captureMode==='Foto'?`<label class="upload">${I('Image')}<strong>Uma imagem, com contexto.</strong><p>Escolha uma foto para a prévia local. Nenhum arquivo será enviado.</p><input type="file" accept="image/*" id="record-photo" aria-label="Selecionar foto para prévia"></label>${photoURL?`<img class="photo-preview" src="${photoURL}" alt="Prévia local do registro">`:''}`:''}${field(captureMode==='Voz'?'Revise a transcrição':'Conte o que você observou · opcional','text',recordDraft.text,'Ex.: Na roda de histórias, Ana pediu a palavra para contar uma lembrança da família.','record',true)}<label style="font-weight:600;font-size:12px">Sobre quem é esse registro?</label><div class="pupilchoices">${['Turma Girassol',...pupils.map(x=>x[0])].map(n=>`<button class="${recordDraft.target===n?'selected':''}" data-act="target:${n}">${n.startsWith('Turma')?I('Users'):avatar(n)}${n.startsWith('Turma')?'Toda a turma':n.split(' ')[0]}</button>`).join('')}</div><div class="formgrid">${field('Data da observação','date',recordDraft.date,'','record',false,'date')}<div class="field"><label for="record-plan">Relacionado a um plano?</label><select id="record-plan" data-scope="record" data-key="plan"><option value="">Registro espontâneo</option>${S.plans.map(p=>`<option value="${p.id}" ${recordDraft.plan===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div></div><div class="formfooter"><span class="fine">Só você acessa os registros da sua turma.</span>${btn('Guardar registro','save-record','primary','Check')}</div></div></div>`}
function recordSuccess(){return `<div class="wizard"><div class="card success"><div class="successmark">${I('Check')}</div><span class="eyebrow">UM MOMENTO QUE NÃO SE PERDE</span><h2>Descoberta guardada.</h2><p>O registro de ${esc(lastRecord)} já faz parte do histórico desta demonstração. Ele poderá apoiar o relatório do período.</p><div class="actions">${link('Ver registros da turma','class/records','btn primary','ArrowRight')}${btn('Registrar outro momento','another-record','','Plus')}</div><p class="fine" style="margin-bottom:0">Salvo apenas nesta sessão do protótipo.</p></div></div>`}
function reports(target){const cls=target==='class',name=cls?'Turma Girassol':target;return back(cls?'Turma Girassol':name,cls?'class/overview':'student/'+name)+head(cls?'TURMA GIRASSOL':'PERCURSO INDIVIDUAL',cls?'Histórias da turma.':`Relatórios de ${esc(name.split(' ')[0])}`, 'O que foi vivido, organizado com cuidado.',link(cls?'Gerar relatório da turma':'Gerar relatório individual','generate/'+target,'btn primary','Sparkles'))+(cls?tabs([['Da turma','reports/class',true],['Individuais','reports/individuals',false]]):'')+(compact?notice('relatórios'):'')+`<div class="toolbar"><div class="searchfield">${I('Search')}<input placeholder="Buscar pelo título" aria-label="Buscar relatórios" data-filter="reports"></div><select class="filter" id="report-status"><option value="">Todos os estados</option>Rascunho</option>Finalizado</option>Arquivado</option></select>${cls&&!compact?link('Modelos da turma','templates','btn small','Settings2'):''}</div><div class="stack" id="reportlist">${S.reports.filter(r=>cls?r.target==='Turma Girassol':r.target===name).map(reportCard).join('')||`<div class="empty card"><h3>As descobertas vão virar história.</h3><p>Ainda não há relatório para este aluno.</p>${compact?'':link('Preparar relatório','generate/'+target,'btn primary','Plus')}</div>`}</div>${cls?`<div class="card pad soft" style="margin-top:25px"><div class="row"><div><h3>Um relatório para cada criança</h3><p class="muted" style="font-size:12px;margin-top:8px">Gere os rascunhos juntos. Revise cada percurso individualmente.</p></div>${compact?link('Ver individuais','reports/individuals','btn small'):link('Preparar lote','generate/batch','btn small','Users')}</div></div>`:''}`}
function reportCard(r){return `<a class="card pad hover" href="#/report/${r.id}" data-search="${esc(r.title)}" data-status="${r.status}"><div class="row"><div class="row"><span class="circle-icon" style="background:var(--yellow)">${I('FileText')}</span><div><h3>${esc(r.title)}</h3><p class="fine" style="margin-top:7px">${esc(r.target)} · ${r.start.split('-').reverse().join('/')} a ${r.end.split('-').reverse().join('/')}</p></div></div>${I('ChevronRight')}</div><div class="card-foot">${pill(r.status,r.status==='Finalizado'?'green':r.status==='Arquivado'?'quiet':'yellow',r.status==='Finalizado'?'Check':'Pencil')}<span>Versão ${r.version} · Modelo Guiadoo</span></div></a>`}
function generate(target){if(compact)return restricted('relatórios',target==='class'||target==='batch'?'reports/class':'reports/'+target);if(reportDraft._target!==target){reportDraft={...reportDraft,_target:target,target:target==='class'||target==='batch'?'Turma Girassol':target,type:target==='batch'?'lote':target==='class'?'coletivo':'individual'};wizardStep=1}const batchMode=reportDraft.type==='lote';return back('Relatórios',target==='class'||batchMode?'reports/class':'reports/'+target)+head('TURMA GIRASSOL',batchMode?'Cada criança, sua história.':'Vamos contar esse percurso?', 'Escolha o período. Confira as evidências. Depois, revise com calma.')+`<div class="wizard"><div class="stepper">${['Período','Modelo','Evidências'].map((t,i)=>`<div class="step ${wizardStep>=i+1?'on':''}"><b>${i+1}</b>${t}</div>`).join('')}</div><div class="card pad">${wizardStep===1?`<span class="eyebrow">1. DEFINIR O RECORTE</span><h2 style="margin:10px 0 24px">Qual história vamos reunir?</h2><div class="sheetinfo">${I(batchMode?'Users':'FileText')}<strong>${batchMode?'Relatórios individuais em lote':reportDraft.type==='individual'?'Relatório individual · '+esc(reportDraft.target):'Um relatório coletivo da Turma Girassol'}</strong></div><div class="formgrid">${field('Data inicial','start',reportDraft.start,'','report',false,'date')}${field('Data final','end',reportDraft.end,'','report',false,'date')}</div><p class="fine">Será considerada a data em que cada observação aconteceu, incluindo o dia final.</p>${batchMode?`<hr class="divider"><label style="font-size:12px;font-weight:600">Crianças deste lote</label>${pupils.map(([n])=>`<label class="listitem"><input type="checkbox" name="batch-student" value="${n}" checked> ${n}</label>`).join('')}`:''}`:wizardStep===2?`<span class="eyebrow">2. ESCOLHER A ESTRUTURA</span><h2 style="margin:10px 0 24px">Com o jeito da sua escola.</h2><div class="field"><label for="report-model">Modelo do relatório</label><select id="report-model" data-scope="report" data-key="model"><option ${reportDraft.model==='Modelo Guiadoo'?'selected':''}>Modelo Guiadoo</option><option ${reportDraft.model==='Modelo da escola'?'selected':''}>Modelo da escola</option></select><small>Contextualização, participação, interações e próximos olhares.</small></div><div class="field"><label>Referências pedagógicas · opcional</label><label class="checklabel"><input type="checkbox" id="reference-check" ${reportDraft.ref?'checked':''}> Considerar referência curricular selecionada</label><small>Exemplo de seleção. O protótipo não verifica normas ou conformidade curricular.</small></div>${link('Ver modelos da turma','templates','textlink','Settings2')}`:`<span class="eyebrow">3. CONFERIR ANTES DE GERAR</span><h2 style="margin:10px 0 20px">A história começa nos registros.</h2><div class="stats-inline"><div><b>${eligible().length}</b><span>registros no período</span></div><div><b>${new Set(eligible().filter(r=>!r.target.startsWith('Turma')).map(r=>r.target)).size}</b><span>crianças com observações</span></div></div><div class="attention">${I('Eye')}<div><strong>Planejamento é contexto, não comprovação.</strong><p>A narrativa utiliza observações registradas. Lacunas ficam visíveis para sua revisão.</p></div></div><div class="stack">${eligible().map(r=>`<div class="listitem"><span class="circle-icon">${I('Pencil')}</span><div class="grow"><strong>${esc(r.target)}</strong><p>${esc(r.text.slice(0,105))}…</p></div></div>`).join('')||'<p class="muted">Não há registros neste recorte. Escolha outro período.</p>'}</div><div class="sheetinfo">Nesta demonstração, será criado um rascunho ilustrativo com base nos registros selecionados. Nenhuma IA externa será chamada.</div>`}<div class="formfooter">${wizardStep>1?btn('Voltar','wizard-back','','ArrowLeft'):link('Cancelar','reports/class','btn flat','')}<div>${wizardStep<3?btn('Continuar','wizard-next','primary','ArrowRight'):btn(batchMode?'Criar rascunhos de exemplo':'Criar rascunho de exemplo','generate-report','primary','Sparkles')}</div></div></div></div>`}
function eligible(){return S.records.filter(r=>r.date>=reportDraft.start&&r.date<=reportDraft.end&&(reportDraft.type!=='individual'||r.target===reportDraft.target||r.target==='Turma Girassol'))}

})}
classPage=function(tab){const html=mobilePriorClassPage(tab);if(!compact||tab!=='overview')return html;
 const template=document.createElement('template');template.innerHTML=html;const split=template.content.querySelector('.split');if(!split)return html;
 const [left,right]=[...split.children],models=right.querySelector('.card.pad.soft');if(models)models.remove();
 const list=left.firstElementChild;const attention=mobileAttentionPupils();const section=document.createElement('section');section.className='mobile-attention';section.innerHTML=`<div class="section-title"><h2>Alunos que precisam de atenção</h2></div><p class="fine" style="margin-bottom:14px">Um olhar para quem está sem observações recentes.</p>${attention.length?`<div class="card pad soft">${attention.map(([n,c,h])=>`<a href="#/student/${encodeURIComponent(n)}" class="listitem">${avatar(n,c)}<div class="grow"><strong>${esc(n)}</strong><p>${esc(h||'Sem registro individual')}</p></div>${I('ChevronRight')}</a>`).join('')}</div>`:'<p class="fine">Nenhum aluno sem observações recentes neste exemplo.</p>'}`;
 list.replaceWith(section);right.classList.add('mobile-class-plans');split.replaceChildren(right,left);if(models)split.append(models);return template.innerHTML;
};
capture=function(id){const html=mobilePriorCapture(id);if(!compact)return html;const template=document.createElement('template');template.innerHTML=html;const choices=template.content.querySelector('.pupilchoices');if(choices){const label=choices.previousElementSibling;label.id='mobile-target-label';const field=document.createElement('div');field.className='mobile-target-field';field.innerHTML=`<button type="button" class="mobile-target-trigger" data-act="mobile-target-open" aria-haspopup="dialog" aria-labelledby="mobile-target-label mobile-target-value">${recordDraft.target==='Turma Girassol'?I('Users'):avatar(recordDraft.target)}<span id="mobile-target-value">${recordDraft.target==='Turma Girassol'?'Toda a turma':esc(recordDraft.target)}</span>${I('ChevronDown')}</button><p class="fine">Escolha toda a turma ou um aluno.</p>`;choices.replaceWith(field)}const footer=template.content.querySelector('.formfooter');if(footer)footer.classList.add('mobile-record-footer');return template.innerHTML};
function mobileTargetDialog(){openDialog('Sobre quem é esse registro?',`<div class="mobile-target-picker"><div class="searchfield">${I('Search')}<input id="mobile-target-search" type="search" placeholder="Buscar aluno pelo nome" aria-label="Buscar aluno pelo nome" autocomplete="off"></div><div class="mobile-target-options"><button type="button" class="mobile-target-option" data-act="mobile-target-select:-1" aria-pressed="${recordDraft.target==='Turma Girassol'}">${I('Users')}<span>Toda a turma</span>${recordDraft.target==='Turma Girassol'?I('Check'):''}</button>${pupils.map(([n,c],i)=>`<button type="button" class="mobile-target-option" data-act="mobile-target-select:${i}" data-pupil-name="${esc(n)}" aria-pressed="${recordDraft.target===n}">${avatar(n,c)}<span>${esc(n)}</span>${recordDraft.target===n?I('Check'):''}</button>`).join('')}</div><p id="mobile-target-empty" class="fine" hidden>Nenhum aluno encontrado. Tente outro nome.</p><p id="mobile-target-count" class="fine" role="status" style="margin-top:12px">${pupils.length} alunos nesta turma</p></div>`)}
document.addEventListener('click',e=>{const button=e.target.closest('[data-act]');if(!button)return;const [action,index]=button.dataset.act.split(':');if(!['mobile-target-open','mobile-target-select'].includes(action))return;e.preventDefault();e.stopImmediatePropagation();if(action==='mobile-target-open')mobileTargetDialog();else{recordDraft.target=index==='-1'?'Turma Girassol':pupils[Number(index)][0];revDirty=true;closeDialog();render();document.querySelector('.mobile-target-trigger')?.focus()}},true);
document.addEventListener('input',e=>{if(e.target.id!=='mobile-target-search')return;const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');const term=normalize(e.target.value.trim());let count=0;document.querySelectorAll('[data-pupil-name]').forEach(el=>{el.hidden=!normalize(el.dataset.pupilName).includes(term);if(!el.hidden)count++});$('#mobile-target-empty').hidden=!!count;$('#mobile-target-count').textContent=count+' alunos encontrados';});
render();
</script></body></html>
